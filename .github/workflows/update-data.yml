name: Update tax sale data

on:
  schedule:
    - cron: "17 14 * * 1"   # every Monday, about 10am Eastern
  workflow_dispatch:
  push:
    paths:
      - "*.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr libreoffice-writer-nogui libreoffice-calc-nogui > /dev/null
          pip install -q -r requirements.txt
      - name: Fetch county data
        run: python fetch_all.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/ region.json
          git diff --cached --quiet || git commit -m "Update tax sale data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
